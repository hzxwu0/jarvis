<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020c14;color:#c8eaf5;font-family:'Noto Sans KR',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid rgba(0,212,255,0.2);background:rgba(2,12,20,0.9);flex-shrink:0}
.logo{font-family:monospace;font-weight:900;font-size:20px;color:#00d4ff;letter-spacing:6px;text-shadow:0 0 20px rgba(0,212,255,0.4)}
.logo span{font-size:9px;color:rgba(200,234,245,0.35);letter-spacing:3px;display:block;margin-top:2px}
.sb{display:flex;align-items:center;gap:14px;font-family:monospace;font-size:11px;color:rgba(200,234,245,0.4)}
.dot{width:7px;height:7px;border-radius:50%;background:#00ffaa;box-shadow:0 0 8px #00ffaa;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
#chat{flex:1;overflow-y:auto;padding:18px 28px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:5;scrollbar-width:thin;scrollbar-color:#0090cc transparent}
.msg{display:flex;gap:10px;max-width:840px;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:9px;font-weight:700;flex-shrink:0}
.jarvis .av{background:rgba(0,212,255,0.12);border:1px solid #00d4ff;color:#00d4ff;box-shadow:0 0 8px rgba(0,212,255,0.3)}
.user .av{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:rgba(200,234,245,0.4)}
.bl{padding:9px 13px;border-radius:2px;font-size:13px;line-height:1.75;max-width:680px;white-space:pre-wrap}
.jarvis .bl{background:#041624;border:1px solid rgba(0,212,255,0.18);border-left:3px solid #00d4ff}
.user .bl{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-right:3px solid rgba(255,255,255,0.2);text-align:right}
.lbl{font-family:monospace;font-size:9px;letter-spacing:2px;margin-bottom:3px}
.jarvis .lbl{color:#00d4ff}
.user .lbl{color:rgba(200,234,245,0.4);text-align:right}
.dots span{display:inline-block;width:4px;height:4px;border-radius:50%;background:#00d4ff;margin:0 2px;animation:bounce 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
footer{position:relative;z-index:10;padding:12px 28px 16px;border-top:1px solid rgba(0,212,255,0.15);background:rgba(2,12,20,0.92);flex-shrink:0}
.ir{display:flex;gap:8px;align-items:center}
#ti{flex:1;background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.22);border-radius:2px;padding:10px 14px;color:#c8eaf5;font-family:'Noto Sans KR',sans-serif;font-size:14px;outline:none}
#ti:focus{border-color:#00d4ff;box-shadow:0 0 8px rgba(0,212,255,0.3)}
#ti::placeholder{color:rgba(200,234,245,0.35)}
.bs{width:42px;height:42px;border-radius:2px;border:1px solid rgba(0,212,255,0.28);background:rgba(0,212,255,0.1);color:#00d4ff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.bs:hover{background:rgba(0,212,255,0.2)}
.bs.rec{border-color:#ff4466;background:rgba(255,68,102,0.18);color:#ff4466;animation:rp 1s infinite}
@keyframes rp{0%,100%{box-shadow:0 0 6px rgba(255,68,102,0.4)}50%{box-shadow:0 0 16px rgba(255,68,102,0.8)}}
.hint{font-family:monospace;font-size:10px;color:rgba(200,234,245,0.25);margin-top:6px;letter-spacing:1px}
.briefing-btn{padding:6px 14px;background:rgba(0,255,170,0.1);border:1px solid rgba(0,255,170,0.3);border-radius:2px;color:#00ffaa;font-family:monospace;font-size:11px;cursor:pointer;letter-spacing:1px;white-space:nowrap}
.briefing-btn:hover{background:rgba(0,255,170,0.2)}
</style>
</head>
<body>
<header>
  <div class="logo">JARVIS<span>JUST A RATHER VERY INTELLIGENT SYSTEM</span></div>
  <div class="sb">
    <button class="briefing-btn" onclick="getBriefing()">📰 브리핑</button>
    <div class="dot"></div>
    <span>온라인</span>
    <span>|</span>
    <span id="clk">--:--:--</span>
  </div>
</header>
<div id="chat"></div>
<footer>
  <div class="ir">
    <input type="text" id="ti" placeholder="자비스에게 말하세요... (유튜브 열어줘, 내일 날씨, 질문 등)"/>
    <button class="bs" onclick="sendText()">➤</button>
    <button class="bs" id="mic" onclick="toggleMic()">🎙</button>
  </div>
  <div class="hint">ENTER 전송 | 🎙 음성 입력 | "도움말" 입력시 할 수 있는 것 목록 표시</div>
</footer>
<script>
let hist=[],isRec=false,recog=null,userLat=null,userLon=null;
const ELEVEN_KEY = ''; // ElevenLabs API 키 (선택사항 - 없으면 브라우저 TTS 사용)
const ELEVEN_VOICE_ID = 'pNInz6obpgDQGcFmaJgB'; // Adam 목소리 (한국어 지원)

if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{
    userLat=p.coords.latitude;
    userLon=p.coords.longitude;
  });
}

setInterval(()=>document.getElementById('clk').textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false}),1000);

const HELP_TEXT = `주인님, 제가 할 수 있는 것들입니다:

🌤 날씨
  "오늘 날씨 어때?" / "내일 날씨" / "이번주 날씨"

🔗 웹사이트 열기
  "유튜브 열어줘" / "네이버 열어줘" / "인스타그램 열어줘"
  "넷플릭스 열어줘" / "지메일 열어줘" / "쿠팡 열어줘"

📰 아침 브리핑
  "오늘 브리핑 해줘" 또는 상단 📰 브리핑 버튼

💬 자유 대화
  날씨 외 모든 질문, 계산, 번역, 지식 질문

🎙 음성 입력
  🎙 버튼 누르고 말하기`;

function addMsg(r,text){
  const c=document.getElementById('chat'),d=document.createElement('div');
  d.className='msg '+r;
  let displayText=text;
  let urlToOpen=null;
  const urlMatch=text.match(/\[OPEN_URL:(https?:\/\/[^\]]+)\]/);
  if(urlMatch){
    urlToOpen=urlMatch[1];
    displayText=text.replace(/\[OPEN_URL:[^\]]+\]/,'').trim();
    // 자동으로 새 탭에서 열기
    setTimeout(()=>window.open(urlToOpen,'_blank'),300);
  }
  d.innerHTML='<div class="av">'+(r==='jarvis'?'J':'U')+'</div><div><div class="lbl">'+(r==='jarvis'?'JARVIS':'USER')+'</div><div class="bl">'+displayText.replace(/\n/g,'<br>')+'</div></div>';
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function addTyping(){
  const c=document.getElementById('chat'),d=document.createElement('div');
  d.className='msg jarvis';d.id='typ';
  d.innerHTML='<div class="av">J</div><div><div class="lbl">JARVIS</div><div class="bl"><div class="dots"><span></span><span></span><span></span></div></div></div>';
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function rmTyping(){const e=document.getElementById('typ');if(e)e.remove();}

async function speak(text){
  const clean=text.replace(/\[OPEN_URL:[^\]]+\]/g,'').replace(/<[^>]+>/g,'').trim();
  if(!clean)return;

  // ElevenLabs TTS 시도
  if(ELEVEN_KEY){
    try{
      const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVEN_VOICE_ID}`,{
        method:'POST',
        headers:{'Content-Type':'application/json','xi-api-key':ELEVEN_KEY},
        body:JSON.stringify({text:clean,model_id:'eleven_multilingual_v2',voice_settings:{stability:0.5,similarity_boost:0.75}})
      });
      if(r.ok){
        const blob=await r.blob();
        const url=URL.createObjectURL(blob);
        const audio=new Audio(url);
        audio.play();
        return;
      }
    }catch(e){}
  }

  // 브라우저 기본 TTS (폴백)
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(clean);
  u.lang='ko-KR';u.rate=1.05;u.pitch=1;
  const voices=window.speechSynthesis.getVoices();
  const koVoice=voices.find(v=>v.lang.startsWith('ko'));
  if(koVoice)u.voice=koVoice;
  window.speechSynthesis.speak(u);
}

async function sendMsg(t){
  if(!t.trim())return;

  // 도움말
  if(t.trim()==='도움말'){
    addMsg('user',t);
    addMsg('jarvis',HELP_TEXT);
    speak('도움말을 표시했습니다, 주인님.');
    return;
  }

  addMsg('user',t);addTyping();
  hist.push({role:'user',content:t});
  try{
    const body={message:t,history:hist.slice(0,-1)};
    if(userLat&&userLon){body.lat=userLat;body.lon=userLon;}
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    rmTyping();
    hist.push({role:'assistant',content:d.reply});
    if(hist.length>20)hist.splice(0,2);
    addMsg('jarvis',d.reply);
    speak(d.reply);
  }catch(e){hist.pop();rmTyping();addMsg('jarvis','오류가 발생했어요.');}
}

async function getBriefing(){
  addMsg('jarvis','브리핑을 준비하겠습니다, 주인님...');
  addTyping();
  try{
    const body={action:'briefing'};
    if(userLat&&userLon){body.lat=userLat;body.lon=userLon;}
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    rmTyping();
    // 마지막 "준비" 메시지 제거
    const msgs=document.querySelectorAll('#chat .msg.jarvis');
    if(msgs.length>0)msgs[msgs.length-1].remove();
    addMsg('jarvis',d.reply);
    speak(d.reply);
  }catch(e){rmTyping();addMsg('jarvis','브리핑 중 오류가 발생했어요.');}
}

function sendText(){
  const i=document.getElementById('ti');
  const t=i.value.trim();
  if(!t)return;
  i.value='';
  sendMsg(t);
}

document.getElementById('ti').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText();}
});

function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){addMsg('jarvis','Chrome에서만 음성 인식이 가능해요.');return;}
  const btn=document.getElementById('mic');
  if(isRec){recog&&recog.stop();isRec=false;btn.classList.remove('rec');btn.textContent='🎙';return;}
  recog=new SR();recog.lang='ko-KR';recog.continuous=false;recog.interimResults=false;
  recog.onstart=()=>{isRec=true;btn.classList.add('rec');btn.textContent='⏹';};
  recog.onresult=e=>{const t=e.results[0][0].transcript.trim();if(t)sendMsg(t);};
  recog.onend=()=>{isRec=false;btn.classList.remove('rec');btn.textContent='🎙';};
  recog.onerror=()=>{isRec=false;btn.classList.remove('rec');btn.textContent='🎙';};
  recog.start();
}

window.speechSynthesis.onvoiceschanged=()=>{};
window.addEventListener('load',()=>{
  addMsg('jarvis','안녕하세요, 주인님. 자비스입니다.\n무엇을 도와드릴까요? "도움말"을 입력하시면 할 수 있는 것들을 알려드립니다.');
});
</script>
</body>
</html>
